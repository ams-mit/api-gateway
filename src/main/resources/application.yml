server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    # No service discovery is used; hide its always-UNKNOWN health indicators
    discovery:
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false
    gateway:
      # Spring Cloud Gateway 5.x only reads the server.webflux prefix
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            # --- Group 1: Identity & Access Service (06-ROUTE-REGISTRY §44) ---
            - id: identity-access-auth
              uri: ${projecta.services.identity-access}
              predicates:
                - Path=/api/v1/auth/**

            - id: identity-access-profile
              uri: ${projecta.services.identity-access}
              predicates:
                - Path=/api/v1/profile/**

            - id: identity-access-admin-users
              uri: ${projecta.services.identity-access}
              predicates:
                - Path=/api/v1/admin/users/**

            - id: identity-access-admin-roles
              uri: ${projecta.services.identity-access}
              predicates:
                - Path=/api/v1/admin/roles/**

            # --- Group 1: Resident Management Service ---
            - id: resident-management-residents
              uri: ${projecta.services.resident-management}
              predicates:
                - Path=/api/v1/residents/**

            - id: resident-management-owners
              uri: ${projecta.services.resident-management}
              predicates:
                - Path=/api/v1/owners/**

            - id: resident-management-tenants
              uri: ${projecta.services.resident-management}
              predicates:
                - Path=/api/v1/tenants/**

            - id: resident-management-staff
              uri: ${projecta.services.resident-management}
              predicates:
                - Path=/api/v1/staff/**

            # --- Groups 2-4: PLACEHOLDER routes, not yet backed by an agreed API contract.
            # Kept by developer decision (see .ai/11-DECISIONS.md); replace with the
            # confirmed method/path entries when each team publishes its contract.

            # --- Group 2: Property & Lease Services ---
            - id: property-unit-properties
              uri: ${projecta.services.property-unit}
              predicates:
                - Path=/api/v1/properties/**

            - id: property-unit-units
              uri: ${projecta.services.property-unit}
              predicates:
                - Path=/api/v1/units/**

            - id: lease-occupancy-leases
              uri: ${projecta.services.lease-occupancy}
              predicates:
                - Path=/api/v1/leases/**

            - id: lease-occupancy-occupancies
              uri: ${projecta.services.lease-occupancy}
              predicates:
                - Path=/api/v1/occupancies/**

            # --- Group 3: Billing & Utility Services ---
            - id: billing-payment-billing
              uri: ${projecta.services.billing-payment}
              predicates:
                - Path=/api/v1/billing/**

            - id: billing-payment-payments
              uri: ${projecta.services.billing-payment}
              predicates:
                - Path=/api/v1/payments/**

            - id: utility-charge-utilities
              uri: ${projecta.services.utility-charge}
              predicates:
                - Path=/api/v1/utilities/**

            # --- Group 4: Operations & Community Services ---
            - id: operations-operations
              uri: ${projecta.services.operations}
              predicates:
                - Path=/api/v1/operations/**

            - id: operations-maintenance
              uri: ${projecta.services.operations}
              predicates:
                - Path=/api/v1/maintenance/**

            - id: community-community
              uri: ${projecta.services.community}
              predicates:
                - Path=/api/v1/community/**

            - id: community-announcements
              uri: ${projecta.services.community}
              predicates:
                - Path=/api/v1/announcements/**

# Project A Microservice Target URLs & Security Settings
projecta:
  services:
    identity-access: ${IDENTITY_ACCESS_SERVICE_URL:http://localhost:3001}
    resident-management: ${RESIDENT_MANAGEMENT_SERVICE_URL:http://localhost:3002}
    property-unit: ${PROPERTY_UNIT_SERVICE_URL:http://localhost:3003}
    lease-occupancy: ${LEASE_OCCUPANCY_SERVICE_URL:http://localhost:3004}
    billing-payment: ${BILLING_PAYMENT_SERVICE_URL:http://localhost:3005}
    utility-charge: ${UTILITY_CHARGE_SERVICE_URL:http://localhost:3006}
    operations: ${OPERATIONS_SERVICE_URL:http://localhost:3007}
    community: ${COMMUNITY_SERVICE_URL:http://localhost:3008}

  security:
    # Gateway routes that skip JWT authentication (exact method-agnostic path patterns)
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
    jwt:
      # Each key value may be a resource location (file:/..., classpath:...) or the PEM text itself.
      # Defaults read the git-ignored ./keys folder (relative to the working directory)
      identity-public-key: ${IDENTITY_JWT_PUBLIC_KEY:file:./keys/identity_public.pem}
      gateway-private-key: ${GATEWAY_JWT_PRIVATE_KEY:file:./keys/gateway_private.pem}
      gateway-token-ttl: ${GATEWAY_JWT_EXPIRES_IN:5m}
      # Registered callers allowed to send Service JWTs. Blank entries are ignored,
      # so a service is only trusted once its public key is configured.
      service-public-keys:
        identity-access-service: ${IDENTITY_ACCESS_SERVICE_PUBLIC_KEY:}
        resident-management-service: ${RESIDENT_MANAGEMENT_SERVICE_PUBLIC_KEY:file:./keys/resident_management_public.pem}

  # Settings for the "services" component of /actuator/health
  health:
    path: /actuator/health
    timeout: ${DOWNSTREAM_HEALTH_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Details are limited to the per-service UP/DOWN list; leaky built-in indicators are disabled below
      show-components: always
      show-details: always
      # Downstream checks are cached so repeated health calls don't fan out to every service
      cache:
        time-to-live: ${HEALTH_CACHE_TTL:10s}
      status:
        # DEGRADED (a backend is down) ranks below UP, so the Gateway itself stays UP / HTTP 200
        order: down, out-of-service, up, degraded, unknown
  health:
    diskspace:
      enabled: false

logging:
  level:
    root: INFO
    com.projecta.apigateway: INFO
    org.springframework.cloud.gateway: INFO
