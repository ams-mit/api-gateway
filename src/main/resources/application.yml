server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

# Project A Microservice Target URLs
projecta:
  services:
    identity-access: ${IDENTITY_ACCESS_SERVICE_URL:http://localhost:3001}
    resident-management: ${RESIDENT_MANAGEMENT_SERVICE_URL:http://localhost:3002}
    property-unit: ${PROPERTY_UNIT_SERVICE_URL:http://localhost:3003}
    lease-occupancy: ${LEASE_OCCUPANCY_SERVICE_URL:http://localhost:3004}
    billing-payment: ${BILLING_PAYMENT_SERVICE_URL:http://localhost:3005}
    utility-charge: ${UTILITY_CHARGE_SERVICE_URL:http://localhost:3006}
    operations: ${OPERATIONS_SERVICE_URL:http://localhost:3007}
    community: ${COMMUNITY_SERVICE_URL:http://localhost:3008}

  security:
    jwt:
      identity-public-key-path: ${IDENTITY_PUBLIC_KEY_PATH:classpath:keys/identity_public.pem}
      gateway-private-key-path: ${GATEWAY_PRIVATE_KEY_PATH:classpath:keys/gateway_private.pem}
      gateway-public-key-path: ${GATEWAY_PUBLIC_KEY_PATH:classpath:keys/gateway_public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.projecta.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
