# =====================================================================
# Project A — API Gateway (kln.ams.apigateway)
# Routes, access rules and internal allowed callers follow the Project A API contracts.
# Human-readable table: docs/gateway-routes.md
#
# Environment-specific values (service URIs, keys, origins) have NO defaults here,
# so a deployment with missing configuration fails fast.
# Local defaults live in application-dev.yml (activate the "dev" profile).
# =====================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    # No service discovery is used; hide its always-UNKNOWN health indicators
    discovery:
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false
    gateway:
      # Spring Cloud Gateway 5.x only reads the server.webflux prefix
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_READ_TIMEOUT_MS:5000}ms
          globalcors:
            # Apply CORS to preflight requests even when no route predicate (e.g. Method) matches OPTIONS
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: "${FRONTEND_ALLOWED_ORIGINS}"
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, Accept, X-Request-ID]
                exposed-headers: [X-Request-ID]
                # Bearer tokens travel in the Authorization header and cookies are stripped, so CORS
                # credentials are never needed. Keeping this false also makes "*" a valid origin value.
                allow-credentials: false
          default-filters:
            # Bearer-JWT architecture: never forward cookies or caller-supplied identity headers
            - RemoveRequestHeader=Cookie
            - RemoveRequestHeader=X-User-ID
            - RemoveRequestHeader=X-Role
            - RemoveRequestHeader=X-Roles
            - RemoveRequestHeader=X-Service-Name
            - RemoveRequestHeader=X-Authenticated-User
            - RemoveRequestHeader=X-Admin
          # -----------------------------------------------------------------
          # Route metadata (read by JwtAuthenticationFilter):
          #   access:          public | user | service   (missing => user)
          #   service:         canonical target service name
          #   api-ids:         provider API IDs (registry) where defined
          #   allowed-callers: optional comma-separated services; if absent, any registered service may call
          # Specific routes use a lower "order" so they win over broad prefixes.
          # -----------------------------------------------------------------
          routes:
            # ================= Internal routes (any verified registered service) =================
            # Internal calls are routed to the service that OWNS the resource named after /internal/.
            # Any HTTP method is forwarded; if the owner has no such endpoint, its own 404 is returned.
            # Resource names no service owns get a Gateway 404 ROUTE_NOT_FOUND.
            # Any registered service with a verified Service JWT may call any internal route; a route can
            # still restrict callers by adding "allowed-callers" metadata.
            #
            # 1) Shared prefixes: /internal/users/{id}/... and /internal/units/{id}/... sub-resources that
            #    belong to a different service than the user/unit itself (evaluated first).
            - id: resident-internal-user-relationships
              uri: ${projecta.services.resident-management-service}
              order: -30
              predicates: ["Path=/api/v1/internal/users/{userId}/relationships,/api/v1/internal/users/{userId}/relationships/**"]
              metadata: { access: service, service: resident-management-service, api-ids: RES-INT-002 }

            - id: lease-internal-user-occupancy
              uri: ${projecta.services.lease-occupancy-service}
              order: -30
              predicates: ["Path=/api/v1/internal/users/{userId}/occupancy,/api/v1/internal/users/{userId}/occupancy/**,/api/v1/internal/units/{unitId}/occupancy,/api/v1/internal/units/{unitId}/occupancy/**,/api/v1/internal/units/{unitId}/occupants,/api/v1/internal/units/{unitId}/occupants/**"]
              metadata: { access: service, service: lease-occupancy-service, api-ids: "LEASE-INT-001,LEASE-INT-002,LEASE-INT-003" }

            - id: billing-internal-unit-user-balance
              uri: ${projecta.services.billing-payment-service}
              order: -30
              predicates: ["Path=/api/v1/internal/units/{unitId}/balance,/api/v1/internal/units/{unitId}/balance/**,/api/v1/internal/users/{userId}/balance-status,/api/v1/internal/users/{userId}/balance-status/**"]
              metadata: { access: service, service: billing-payment-service, api-ids: "BILL-INT-001,BILL-INT-002" }

            - id: utility-internal-unit-charges
              uri: ${projecta.services.utility-charge-service}
              order: -30
              predicates: ["Path=/api/v1/internal/units/{unitId}/charges,/api/v1/internal/units/{unitId}/charges/**"]
              metadata: { access: service, service: utility-charge-service, api-ids: UTIL-INT-001 }

            # 2) Resource ownership (canonical API ownership of Project A)
            - id: identity-internal
              uri: ${projecta.services.identity-access-service}
              order: -20
              predicates: ["Path=/api/v1/internal/users/**,/api/v1/internal/roles/**,/api/v1/internal/permissions/**"]
              metadata: { access: service, service: identity-access-service, api-ids: "IAM-INT-001,IAM-INT-002" }

            - id: resident-internal
              uri: ${projecta.services.resident-management-service}
              order: -20
              predicates: ["Path=/api/v1/internal/residents/**,/api/v1/internal/owners/**,/api/v1/internal/tenants/**,/api/v1/internal/staff/**"]
              metadata: { access: service, service: resident-management-service, api-ids: RES-INT-001 }

            - id: property-internal
              uri: ${projecta.services.property-unit-service}
              order: -20
              predicates: ["Path=/api/v1/internal/units/**,/api/v1/internal/buildings/**,/api/v1/internal/floors/**,/api/v1/internal/unit-types/**,/api/v1/internal/ownerships/**"]
              metadata: { access: service, service: property-unit-service, api-ids: "PROP-INT-001,PROP-INT-002,PROP-INT-003,PROP-INT-004" }

            - id: lease-internal
              uri: ${projecta.services.lease-occupancy-service}
              order: -20
              predicates: ["Path=/api/v1/internal/leases/**,/api/v1/internal/occupancies/**,/api/v1/internal/occupants/**"]
              metadata: { access: service, service: lease-occupancy-service }

            - id: billing-internal
              uri: ${projecta.services.billing-payment-service}
              order: -20
              predicates: ["Path=/api/v1/internal/payments/**,/api/v1/internal/balance/**,/api/v1/internal/invoices/**,/api/v1/internal/charge-rules/**,/api/v1/internal/receipts/**,/api/v1/internal/adjustments/**"]
              metadata: { access: service, service: billing-payment-service, api-ids: BILL-INT-003 }

            - id: utility-internal
              uri: ${projecta.services.utility-charge-service}
              order: -20
              predicates: ["Path=/api/v1/internal/utility-charges/**"]
              metadata: { access: service, service: utility-charge-service, api-ids: UTIL-INT-002 }

            - id: operations-internal
              uri: ${projecta.services.operations-service}
              order: -20
              predicates: ["Path=/api/v1/internal/maintenance-requests/**,/api/v1/internal/work-orders/**,/api/v1/internal/assignments/**,/api/v1/internal/facilities/**,/api/v1/internal/bookings/**"]
              metadata: { access: service, service: operations-service }

            - id: community-internal
              uri: ${projecta.services.community-service}
              order: -20
              predicates: ["Path=/api/v1/internal/notifications,/api/v1/internal/notifications/**,/api/v1/internal/visitors/**,/api/v1/internal/announcements/**"]
              metadata: { access: service, service: community-service, api-ids: "COMM-INT-001,COMM-INT-002,COMM-INT-003" }

            # ================= Specific user routes that overlap broad prefixes =================
            - id: lease-active-occupancy
              uri: ${projecta.services.lease-occupancy-service}
              order: -10
              predicates: [Method=GET, "Path=/api/v1/units/{unitId}/active-occupancy"]
              metadata: { access: user, service: lease-occupancy-service }

            # Retired mixed public/internal endpoint; validation moved to the /api/v1/internal APIs.
            # Without this, /api/v1/leases/** would forward it with leaseId=validate.
            - id: lease-legacy-validate-blocked
              uri: no://op
              order: -10
              predicates: ["Path=/api/v1/leases/validate"]
              metadata: { access: blocked, service: lease-occupancy-service }

            # ================= Group 1: identity-access-service =================
            # Public authentication endpoints (no token). register / forgot-password / reset-password are
            # project additions beyond the Gateway specification, matching identity-access-service's own rules.
            - id: identity-auth
              uri: ${projecta.services.identity-access-service}
              predicates: [Method=POST, "Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/forgot-password,/api/v1/auth/reset-password"]
              metadata: { access: public, service: identity-access-service }

            - id: identity-auth-me
              uri: ${projecta.services.identity-access-service}
              predicates: [Method=GET, "Path=/api/v1/auth/me"]
              metadata: { access: user, service: identity-access-service }

            - id: identity-auth-logout
              uri: ${projecta.services.identity-access-service}
              predicates: [Method=POST, "Path=/api/v1/auth/logout"]
              metadata: { access: user, service: identity-access-service }

            - id: identity-auth-change-password
              uri: ${projecta.services.identity-access-service}
              predicates: [Method=PUT, "Path=/api/v1/auth/me/password"]
              metadata: { access: user, service: identity-access-service }

            - id: identity-users
              uri: ${projecta.services.identity-access-service}
              predicates: ["Method=GET,POST,PUT,PATCH", "Path=/api/v1/users,/api/v1/users/**"]
              metadata: { access: user, service: identity-access-service }

            - id: identity-roles
              uri: ${projecta.services.identity-access-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/roles,/api/v1/roles/**"]
              metadata: { access: user, service: identity-access-service }

            - id: identity-permissions
              uri: ${projecta.services.identity-access-service}
              predicates: [Method=GET, "Path=/api/v1/permissions"]
              metadata: { access: user, service: identity-access-service }

            # ================= Group 1: resident-management-service =================
            - id: resident-residents
              uri: ${projecta.services.resident-management-service}
              predicates: ["Method=GET,POST,PATCH", "Path=/api/v1/residents,/api/v1/residents/**"]
              metadata: { access: user, service: resident-management-service }

            - id: resident-owners
              uri: ${projecta.services.resident-management-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/owners,/api/v1/owners/**"]
              metadata: { access: user, service: resident-management-service }

            - id: resident-tenants
              uri: ${projecta.services.resident-management-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/tenants,/api/v1/tenants/**"]
              metadata: { access: user, service: resident-management-service }

            - id: resident-staff
              uri: ${projecta.services.resident-management-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/staff"]
              metadata: { access: user, service: resident-management-service }

            # ================= Group 2: property-unit-service =================
            - id: property-buildings
              uri: ${projecta.services.property-unit-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/buildings"]
              metadata: { access: user, service: property-unit-service }

            - id: property-unit-types
              uri: ${projecta.services.property-unit-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/unit-types"]
              metadata: { access: user, service: property-unit-service }

            - id: property-units
              uri: ${projecta.services.property-unit-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/units,/api/v1/units/**"]
              metadata: { access: user, service: property-unit-service }

            - id: property-ownerships
              uri: ${projecta.services.property-unit-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/ownerships"]
              metadata: { access: user, service: property-unit-service }

            # ================= Group 2: lease-occupancy-service =================
            - id: lease-leases
              uri: ${projecta.services.lease-occupancy-service}
              predicates: ["Method=GET,POST,PATCH", "Path=/api/v1/leases,/api/v1/leases/**"]
              metadata: { access: user, service: lease-occupancy-service }

            - id: lease-occupancies
              uri: ${projecta.services.lease-occupancy-service}
              predicates: ["Method=GET,POST,PATCH", "Path=/api/v1/occupancies,/api/v1/occupancies/**"]
              metadata: { access: user, service: lease-occupancy-service }

            # ================= Group 3: billing-payment-service =================
            - id: billing-charge-rules
              uri: ${projecta.services.billing-payment-service}
              predicates: ["Method=GET,POST,PUT,PATCH", "Path=/api/v1/charge-rules,/api/v1/charge-rules/**"]
              metadata: { access: user, service: billing-payment-service }

            - id: billing-invoices
              uri: ${projecta.services.billing-payment-service}
              predicates: ["Method=GET,POST,PATCH", "Path=/api/v1/invoices,/api/v1/invoices/**"]
              metadata: { access: user, service: billing-payment-service }

            - id: billing-payments
              uri: ${projecta.services.billing-payment-service}
              predicates: ["Method=GET,POST,PATCH", "Path=/api/v1/payments,/api/v1/payments/**"]
              metadata: { access: user, service: billing-payment-service }

            - id: billing-receipts
              uri: ${projecta.services.billing-payment-service}
              predicates: [Method=GET, "Path=/api/v1/receipts/**"]
              metadata: { access: user, service: billing-payment-service }

            - id: billing-adjustments
              uri: ${projecta.services.billing-payment-service}
              predicates: ["Method=GET,POST", "Path=/api/v1/adjustments,/api/v1/adjustments/**"]
              metadata: { access: user, service: billing-payment-service }

            - id: billing-balances
              uri: ${projecta.services.billing-payment-service}
              predicates: [Method=GET, "Path=/api/v1/balance/**"]
              metadata: { access: user, service: billing-payment-service }

            - id: billing-reports
              uri: ${projecta.services.billing-payment-service}
              predicates: [Method=GET, "Path=/api/v1/reports/finance-dashboard,/api/v1/reports/arrears,/api/v1/reports/collection-summary,/api/v1/reports/payment-history"]
              metadata: { access: user, service: billing-payment-service }

            # ================= Group 3: utility-charge-service =================
            - id: utility-charges
              uri: ${projecta.services.utility-charge-service}
              predicates: ["Method=GET,POST,PATCH", "Path=/api/v1/utility-charges,/api/v1/utility-charges/**"]
              metadata: { access: user, service: utility-charge-service }

            - id: utility-reports
              uri: ${projecta.services.utility-charge-service}
              predicates: [Method=GET, "Path=/api/v1/reports/utility-summary,/api/v1/reports/utility-consumption"]
              metadata: { access: user, service: utility-charge-service }

            # ================= Group 4: operations-service (methods pending its contract) =================
            - id: operations-maintenance
              uri: ${projecta.services.operations-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/maintenance-requests,/api/v1/maintenance-requests/**"]
              metadata: { access: user, service: operations-service }

            - id: operations-work-orders
              uri: ${projecta.services.operations-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/work-orders,/api/v1/work-orders/**"]
              metadata: { access: user, service: operations-service }

            - id: operations-assignments
              uri: ${projecta.services.operations-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/assignments,/api/v1/assignments/**"]
              metadata: { access: user, service: operations-service }

            - id: operations-facilities
              uri: ${projecta.services.operations-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/facilities,/api/v1/facilities/**"]
              metadata: { access: user, service: operations-service }

            - id: operations-bookings
              uri: ${projecta.services.operations-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/bookings,/api/v1/bookings/**"]
              metadata: { access: user, service: operations-service }

            # ================= Group 4: community-service (methods pending its contract) =================
            - id: community-visitors
              uri: ${projecta.services.community-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/visitors,/api/v1/visitors/**"]
              metadata: { access: user, service: community-service }

            - id: community-announcements
              uri: ${projecta.services.community-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/announcements,/api/v1/announcements/**"]
              metadata: { access: user, service: community-service }

            - id: community-notifications
              uri: ${projecta.services.community-service}
              predicates: ["Method=GET,POST,PUT,PATCH,DELETE", "Path=/api/v1/notifications,/api/v1/notifications/**"]
              metadata: { access: user, service: community-service }

            # ================= Backend OpenAPI documents for the Swagger index =================
            # Documented path rewrite: /api-docs/<service> -> <service>/v3/api-docs (read-only, GET)
            - id: docs-identity-access-service
              uri: ${projecta.services.identity-access-service}
              predicates: [Method=GET, "Path=/api-docs/identity-access-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: identity-access-service }
            - id: docs-resident-management-service
              uri: ${projecta.services.resident-management-service}
              predicates: [Method=GET, "Path=/api-docs/resident-management-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: resident-management-service }
            - id: docs-property-unit-service
              uri: ${projecta.services.property-unit-service}
              predicates: [Method=GET, "Path=/api-docs/property-unit-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: property-unit-service }
            - id: docs-lease-occupancy-service
              uri: ${projecta.services.lease-occupancy-service}
              predicates: [Method=GET, "Path=/api-docs/lease-occupancy-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: lease-occupancy-service }
            - id: docs-billing-payment-service
              uri: ${projecta.services.billing-payment-service}
              predicates: [Method=GET, "Path=/api-docs/billing-payment-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: billing-payment-service }
            - id: docs-utility-charge-service
              uri: ${projecta.services.utility-charge-service}
              predicates: [Method=GET, "Path=/api-docs/utility-charge-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: utility-charge-service }
            - id: docs-operations-service
              uri: ${projecta.services.operations-service}
              predicates: [Method=GET, "Path=/api-docs/operations-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: operations-service }
            - id: docs-community-service
              uri: ${projecta.services.community-service}
              predicates: [Method=GET, "Path=/api-docs/community-service"]
              filters: ["SetPath=/v3/api-docs"]
              metadata: { access: public, service: community-service }

projecta:
  # Canonical service name -> base URI (required; see application-dev.yml for local values)
  services:
    identity-access-service: ${IDENTITY_SERVICE_URI}
    resident-management-service: ${RESIDENT_SERVICE_URI}
    property-unit-service: ${PROPERTY_SERVICE_URI}
    lease-occupancy-service: ${LEASE_SERVICE_URI}
    billing-payment-service: ${BILLING_SERVICE_URI}
    utility-charge-service: ${UTILITY_SERVICE_URI}
    operations-service: ${OPERATIONS_SERVICE_URI}
    community-service: ${COMMUNITY_SERVICE_URI}

  security:
    # Browser origins allowed by CORS: a comma-separated list, or "*" for any origin
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS}
    jwt:
      # Each key value is a location (file:/..., classpath:...) or the PEM text itself.
      identity-public-key: ${IDENTITY_PUBLIC_KEY}
      gateway-private-key: ${GATEWAY_PRIVATE_KEY}
      # Optional: if set, startup verifies it matches the Gateway private key
      gateway-public-key: ${GATEWAY_PUBLIC_KEY:}
      gateway-token-ttl: ${GATEWAY_JWT_EXPIRES_IN:5m}
      # Service JWT verification keys; every backend service must be registered (JWT standard)
      service-public-keys:
        identity-access-service: ${IDENTITY_SERVICE_PUBLIC_KEY}
        resident-management-service: ${RESIDENT_SERVICE_PUBLIC_KEY}
        property-unit-service: ${PROPERTY_SERVICE_PUBLIC_KEY}
        lease-occupancy-service: ${LEASE_SERVICE_PUBLIC_KEY}
        billing-payment-service: ${BILLING_SERVICE_PUBLIC_KEY}
        utility-charge-service: ${UTILITY_SERVICE_PUBLIC_KEY}
        operations-service: ${OPERATIONS_SERVICE_PUBLIC_KEY}
        community-service: ${COMMUNITY_SERVICE_PUBLIC_KEY}

  # Settings for the "services" component of /actuator/health
  health:
    path: /actuator/health
    timeout: ${DOWNSTREAM_HEALTH_TIMEOUT:2s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Gateway route documentation plus each backend's authoritative OpenAPI (via the docs-* routes)
    urls:
      - { name: api-gateway (routes), url: /v3/api-docs }
      - { name: identity-access-service, url: /api-docs/identity-access-service }
      - { name: resident-management-service, url: /api-docs/resident-management-service }
      - { name: property-unit-service, url: /api-docs/property-unit-service }
      - { name: lease-occupancy-service, url: /api-docs/lease-occupancy-service }
      - { name: billing-payment-service, url: /api-docs/billing-payment-service }
      - { name: utility-charge-service, url: /api-docs/utility-charge-service }
      - { name: operations-service, url: /api-docs/operations-service }
      - { name: community-service, url: /api-docs/community-service }

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Details are limited to the per-service UP/DOWN list; leaky built-in indicators are disabled below
      show-components: always
      show-details: always
      # Downstream checks are cached so repeated health calls don't fan out to every service
      cache:
        time-to-live: ${HEALTH_CACHE_TTL:10s}
      status:
        # DEGRADED (a backend is down) ranks below UP, so the Gateway itself stays UP / HTTP 200
        order: down, out-of-service, up, degraded, unknown
  health:
    diskspace:
      enabled: false
    ssl:
      enabled: false

info:
  app:
    name: api-gateway
    description: Project A API Gateway

logging:
  level:
    root: INFO
    kln.ams.apigateway: INFO
    org.springframework.cloud.gateway: INFO
