# Standalone Gateway container. In the integrated Project A compose, add the eight backend
# services to the same network and point the *_SERVICE_URI values at their service names.
# Every variable below is required (see .env.example); compose stops early if one is missing.
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecta-api-gateway
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      IDENTITY_SERVICE_URI: ${IDENTITY_SERVICE_URI:?set in .env}
      RESIDENT_SERVICE_URI: ${RESIDENT_SERVICE_URI:?set in .env}
      PROPERTY_SERVICE_URI: ${PROPERTY_SERVICE_URI:?set in .env}
      LEASE_SERVICE_URI: ${LEASE_SERVICE_URI:?set in .env}
      BILLING_SERVICE_URI: ${BILLING_SERVICE_URI:?set in .env}
      UTILITY_SERVICE_URI: ${UTILITY_SERVICE_URI:?set in .env}
      OPERATIONS_SERVICE_URI: ${OPERATIONS_SERVICE_URI:?set in .env}
      COMMUNITY_SERVICE_URI: ${COMMUNITY_SERVICE_URI:?set in .env}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?set in .env}
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:-2000}
      GATEWAY_READ_TIMEOUT_MS: ${GATEWAY_READ_TIMEOUT_MS:-5000}
      IDENTITY_PUBLIC_KEY: ${IDENTITY_PUBLIC_KEY:?set in .env}
      GATEWAY_PRIVATE_KEY: ${GATEWAY_PRIVATE_KEY:?set in .env}
      GATEWAY_PUBLIC_KEY: ${GATEWAY_PUBLIC_KEY:-}
      GATEWAY_JWT_EXPIRES_IN: ${GATEWAY_JWT_EXPIRES_IN:-5m}
      IDENTITY_SERVICE_PUBLIC_KEY: ${IDENTITY_SERVICE_PUBLIC_KEY:?set in .env}
      RESIDENT_SERVICE_PUBLIC_KEY: ${RESIDENT_SERVICE_PUBLIC_KEY:?set in .env}
      PROPERTY_SERVICE_PUBLIC_KEY: ${PROPERTY_SERVICE_PUBLIC_KEY:?set in .env}
      LEASE_SERVICE_PUBLIC_KEY: ${LEASE_SERVICE_PUBLIC_KEY:?set in .env}
      BILLING_SERVICE_PUBLIC_KEY: ${BILLING_SERVICE_PUBLIC_KEY:?set in .env}
      UTILITY_SERVICE_PUBLIC_KEY: ${UTILITY_SERVICE_PUBLIC_KEY:?set in .env}
      OPERATIONS_SERVICE_PUBLIC_KEY: ${OPERATIONS_SERVICE_PUBLIC_KEY:?set in .env}
      COMMUNITY_SERVICE_PUBLIC_KEY: ${COMMUNITY_SERVICE_PUBLIC_KEY:?set in .env}
      DOWNSTREAM_HEALTH_TIMEOUT: ${DOWNSTREAM_HEALTH_TIMEOUT:-2s}
      HEALTH_CACHE_TTL: ${HEALTH_CACHE_TTL:-10s}
    volumes:
      # Git-ignored key folder; mounted read-only, never baked into the image
      - ./keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - projecta-network

networks:
  projecta-network:
    name: projecta-network
    external: true
